[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demanda-delivery-v2"
version = "3.3.0"
description = "Análisis de Elasticidad Precio-Demanda en Delivery de Comidas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "patsy>=0.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["data_prep", "diagnostics", "modeling", "rcs_utils"]