name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Sin los datos de Kaggle corren los tests de código y artefactos certificados;
      # los que recalculan cifras del informe se omiten (ver tests/conftest.py).
      - name: Tests (los que requieren datos se omiten)
        run: python -m pytest -v -rs
